<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agricultural Image Analysis Prototype</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <section class="card">
            <p class="eyebrow">AI / API Integration Prototype</p>
            <h1>Agricultural Image Analysis</h1>
            <p class="intro">
                Upload a crop image and submit it to the configured Plantix image-analysis API.
                This repository is a technical prototype for API integration and agricultural image workflows.
            </p>

            <form id="identificationForm">
                <label for="imagenInput">Image</label>
                <input type="file" id="imagenInput" name="imagenInput" accept="image/*" required>

                <label for="cultivoSelect">Crop</label>
                <select id="cultivoSelect" name="cultivoSelect" required>
                    <option value="coffee">Coffee</option>
                    <option value="pepper">Pepper</option>
                    <option value="corn">Corn</option>
                </select>

                <button type="submit">Analyze image</button>
            </form>

            <section class="result-section" aria-live="polite">
                <h2>API response</h2>
                <pre id="resultado">No analysis submitted yet.</pre>
            </section>
        </section>
    </main>

    <script>
        const form = document.querySelector("#identificationForm");
        const result = document.querySelector("#resultado");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const image = document.querySelector("#imagenInput").files[0];
            const crop = document.querySelector("#cultivoSelect").value;

            if (!image) {
                result.textContent = "Please select an image.";
                return;
            }

            const payload = new FormData();
            payload.append("imagenInput", image);
            payload.append("cultivoSelect", crop);

            result.textContent = "Analyzing...";

            try {
                const response = await fetch("API.php", {
                    method: "POST",
                    body: payload
                });

                const body = await response.json();

                if (!response.ok) {
                    throw new Error(body.error || "The analysis request failed.");
                }

                result.textContent = JSON.stringify(body, null, 2);
            } catch (error) {
                result.textContent = `Error: ${error.message}`;
            }
        });
    </script>
</body>
</html>
